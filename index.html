<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard de Inspeção Geométrica Local</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background-color: #eef2f5;
      padding-top: 60px;
    }
    .card {
      display: inline-block;
      width: 380px;
      padding: 30px;
      border-radius: 15px;
      background: white;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }
    h2 {
      color: #333;
      margin-bottom: 5px;
    }
    p {
      color: #666;
      font-size: 14px;
    }
    .status-box {
      font-size: 22px;
      font-weight: bold;
      margin-top: 25px;
      padding: 20px;
      border-radius: 10px;
      color: white;
      background-color: #6c757d;
      transition: all 0.3s ease;
    }
    /* Estilização dinâmica por geometria */
    .quadrado { background-color: #28a745; box-shadow: 0 4px 12px rgba(40, 167, 69, 0.4); }
    .circulo  { background-color: #007bff; box-shadow: 0 4px 12px rgba(0, 123, 255, 0.4); }
    .triangulo{ background-color: #fd7e14; box-shadow: 0 4px 12px rgba(253, 126, 20, 0.4); }
    .nenhum   { background-color: #dc3545; box-shadow: 0 4px 12px rgba(220, 53, 69, 0.4); }

    /* Estilo dos botões de controle local */
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-quadrado { background-color: #28a745; }
    .btn-circulo  { background-color: #007bff; }
    .btn-triangulo{ background-color: #fd7e14; }
    .btn-nenhum   { background-color: #dc3545; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Inspeção Geométrica</h2>
    <p>Simulação Local (Sem conexão de rede)</p>
    <div id="status" class="status-box nenhum">Aguardando peça...</div>

    <!-- Controles para simular a inspeção de formas localmente -->
    <div class="controls">
      <button class="btn btn-quadrado" onclick="atualizarForma('QUADRADO')">Quadrado</button>
      <button class="btn btn-circulo" onclick="atualizarForma('CIRCULO')">Círculo</button>
      <button class="btn btn-triangulo" onclick="atualizarForma('TRIANGULO')">Triângulo</button>
      <button class="btn btn-nenhum" onclick="atualizarForma('NENHUM')">Limpar</button>
    </div>
  </div>

  <script>
    // Função local para atualizar a interface diretamente sem rede/broker
    function atualizarForma(forma) {
      const statusDiv = document.getElementById("status");

      if (forma === "QUADRADO") {
        statusDiv.innerText = "Forma: Quadrado";
        statusDiv.className = "status-box quadrado";
      } else if (forma === "CIRCULO") {
        statusDiv.innerText = "Forma: Círculo";
        statusDiv.className = "status-box circulo";
      } else if (forma === "TRIANGULO") {
        statusDiv.innerText = "Forma: Triângulo";
        statusDiv.className = "status-box triangulo";
      } else {
        statusDiv.innerText = "Sem Peça / Desconhecida";
        statusDiv.className = "status-box nenhum";
      }
    }
  </script>
</body>
</html>
